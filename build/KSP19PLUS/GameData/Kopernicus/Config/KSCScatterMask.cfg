@Kopernicus:FOR[Kopernicus]
{
    @Body,*
    {
	    %PQS
        {
            %Mods
            {
				// Prevent scatters from spawning on the KSC
				KSCScatterMask
				{
					name = KopernicusMaskKSC
					debugShowColorMap = false
					colorMap = Kopernicus/Graphics/kscMask.dds
					angle = 15
					radius = 1400
				}
            }
        }
	}
}